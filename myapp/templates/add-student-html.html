{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link rel="stylesheet" href="{% static 'css/add_student_html.css' %}">
</head>
<body>

<div class="container">

    <div class="card">

        <h2>Add Student</h2>
        <p>Enter the student details below.</p>

        <form method="post">
            {% csrf_token %}

            <div class="input-group">
                <label>Name</label>
                <input type="text" name="name" placeholder="Enter Name" required>
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" name="age" placeholder="Enter Age" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="buttons">
                <button type="submit" class="save-btn">
                    Save Student
                </button>

                <a href="{% url 'students' %}" class="cancel-btn">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
