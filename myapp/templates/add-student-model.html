{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link rel="stylesheet" href="{% static 'css/add_student.css' %}">
</head>
<body>

<div class="container">

    <div class="card">

        <h2>Add Student</h2>
        <p>Fill in the details below.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="buttons">
                <button type="submit" class="save-btn">
                    Save Student
                </button>

                <a href="{% url 'students' %}" class="cancel-btn">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
