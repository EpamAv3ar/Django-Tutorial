<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
</head>
<body>
<h2>Delete Student</h2>
<p>Are you sure you want to delete <b>{{ student.name }}</b>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'students' %}">Cancel</a>
</form>
</body>
</html>
