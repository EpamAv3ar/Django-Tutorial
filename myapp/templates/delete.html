{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>

    <link rel="stylesheet" href="{% static 'css/add_student_html.css' %}">
</head>
<body>
  

<div class="container">

    <div class="card">

        <h2>Delete Student</h2>

        <p>Are you sure you want to delete this student?</p>

        <h3>{{ student.name }}</h3>
        <p>Email : {{ student.email }}</p>
        <p>Age : {{ student.age }}</p>
        <p>Department : {{ student.department.department_name }}</p>

        <form method="POST">
            {% csrf_token %}

            <div class="buttons">
                <button type="submit" class="save-btn">
                    Yes, Delete
                </button>

                <a href="{% url 'students' %}" class="cancel-btn">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
