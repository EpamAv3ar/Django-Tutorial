<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Customer Details</h2>
        <a href="{% url 'addpage' %}" class="btn btn-success">
            Add Customer
        </a>
    </div>
    <table class="table table-bordered table-hover table-striped shadow">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th width="170">Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for customer in home %}
        <tr>
            <td>{{ customer.name }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.phone }}</td>
            <td>{{ customer.address }}</td>
            <td>
                <a href="{% url 'updatepage' customer.id %}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>
                <a href="{% url 'deletepage' customer.id %}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'product' %}" class="btn btn-primary">
        View Products
    </a>
</div>
</body>
</html>
